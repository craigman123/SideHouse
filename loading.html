<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Side House — Starting Up</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background-color: #0d1117;
        color: #c9d1d9;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    .logo {
        max-width: 260px;
        margin-bottom: 30px;
    }

    .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #21262d;
        border-top-color: #3fb950;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .status {
        font-size: 15px;
        font-weight: 600;
        color: #8b949e;
    }

    .status strong {
        color: #3fb950;
    }
</style>
</head>
<body>

    <img src="https://raw.githubusercontent.com/craigman123/SideHouse/master/public/images/logo.png" alt="Side House" class="logo">

    <div class="spinner"></div>
    <div class="status" id="status">Waking up the server<strong id="dots">...</strong></div>

    <script>
        const APP_URL = "https://sidehouse.onrender.com";
        const statusEl = document.getElementById('status');
        const dotsEl = document.getElementById('dots');

        let dotCount = 0;
        setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            dotsEl.textContent = '.'.repeat(dotCount || 1);
        }, 500);

        let attempts = 0;

        function checkServer() {
            attempts++;
            fetch(APP_URL, { mode: 'no-cors', cache: 'no-store' })
                .then(() => {
                    statusEl.innerHTML = '<strong>Ready! Redirecting...</strong>';
                    window.location.href = APP_URL;
                })
                .catch(() => {
                    setTimeout(checkServer, 2000);
                });
        }

        // Give it a moment before first check
        setTimeout(checkServer, 1000);
    </script>

</body>
</html>
